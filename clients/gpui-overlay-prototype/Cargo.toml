[package]
name = "gpui-overlay-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "DoubaoVoiceClient"
path = "src/main.rs"

[dependencies]
gpui = { version = "=0.2.2", default-features = false }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.17"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = "0.17"
ctrlc = { version = "3.4", features = ["termination"] }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "inspector", "wayland", "x11"] }
