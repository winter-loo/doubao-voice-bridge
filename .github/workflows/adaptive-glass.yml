name: Adaptive liquid glass regression
on:
  push:
    branches: ['feat/glass-custom-material']
    paths:
      - 'experiments/glass-live/**'
      - 'clients/desktop-client/src/voice_glass.rs'
      - '.github/workflows/adaptive-glass.yml'
permissions:
  contents: read
concurrency:
  group: adaptive-liquid-glass-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apply-and-check:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            clients/desktop-client
            experiments/glass-live
          key: voice-liquid-integration
      - name: Check immutable reference and archive exact source
        shell: python
        run: |
          import subprocess, pathlib, os
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          path='experiments/glass-live/src/liquid_reference.hlsl'
          assert git('rev-parse','HEAD:'+path)=='4e72b8fbb6b8db4ac6f8d426a26d2d368fb27692'
          expected=subprocess.check_output(['git','show','HEAD:'+path])
          assert pathlib.Path(path).read_bytes().replace(b'\r\n',b'\n')==expected
          assert not git('status','--porcelain','--untracked-files=no')
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          (root/'adaptive-commit.txt').write_text(git('rev-parse','HEAD'))
          subprocess.run(['git','archive','--format=zip','-o',str(root/'adaptive-source.zip'),'HEAD','experiments/glass-live','clients/desktop-client','.github/workflows/adaptive-glass.yml'],check=True)
      - name: Require three isolated native canvas and actual mouse-routing passes
        shell: pwsh
        env:
          GLASS_CI_NATIVE_FIXTURE: '1'
        run: |
          # This integration test owns the CI desktop/cursor. Never run it in
          # parallel with the unit suite or infer success from zero selected tests.
          for ($trial = 1; $trial -le 3; $trial++) {
            $log = Join-Path $env:RUNNER_TEMP ('adaptive-native-' + $trial + '.txt')
            cargo test --locked --manifest-path experiments/glass-live/Cargo.toml --lib voice_window::adaptive_window_checks::native_canvas_visible_input_stays_capsule_and_both_windows_move -- --ignored --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $text = [string](Get-Content -LiteralPath $log -Raw)
            if (-not $text.Contains('[adaptive-native] PASS:') -or -not $text.Contains('1 passed; 0 failed; 0 ignored;')) { throw 'Native fixture was not actually executed and passed' }
          }
      - name: Execute shared library unit tests and actual HLSL on WARP
        shell: pwsh
        run: |
          $env:GLASS_MATERIAL_FIXTURES = Join-Path $env:RUNNER_TEMP 'adaptive-fixtures'
          cargo test --locked --manifest-path experiments/glass-live/Cargo.toml -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-renderer-evidence
          path: |
            ${{ runner.temp }}/adaptive-source.zip
            ${{ runner.temp }}/adaptive-commit.txt
            ${{ runner.temp }}/adaptive-native-*.txt
            ${{ runner.temp }}/adaptive-fixtures*
          if-no-files-found: error
          retention-days: 7
      - name: Test and build formal voice client, not the standalone preview
        shell: pwsh
        run: |
          cargo test --locked --manifest-path clients/desktop-client/Cargo.toml --bin DoubaoVoiceClient
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --manifest-path clients/desktop-client/Cargo.toml --bin DoubaoVoiceClient
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute formal EXE self-test without desktop capture, audio or network
        shell: pwsh
        run: |
          $exe = Resolve-Path clients/desktop-client/target/release/DoubaoVoiceClient.exe
          $out = Join-Path $env:RUNNER_TEMP 'adaptive-selftest.stdout.txt'
          $err = Join-Path $env:RUNNER_TEMP 'adaptive-selftest.stderr.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--liquid-glass-self-test' -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          $null = $p.Handle
          try {
            if (-not $p.WaitForExit(600000)) { $p.Kill(); $p.WaitForExit(); throw 'Self-test timed out' }
            $p.WaitForExit()
            Get-Content $out
            Get-Content $err
            $text = [string](Get-Content $out -Raw) + [string](Get-Content $err -Raw)
            if ($p.ExitCode -ne 0 -or -not $text.Contains('[voice-glass-self-test] PASS') -or -not $text.Contains('[adaptive-glass] PASS;')) { throw 'Formal adaptive optical self-test failed' }
          } finally { $p.Dispose() }
          $commit = (git rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -ne $env:GITHUB_SHA) { throw 'Build commit changed' }
          if ((git status --porcelain --untracked-files=no | Out-String).Trim()) { throw 'Tests changed tracked source or lockfiles' }
          [ordered]@{commit=$commit; sha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash; material='LENS_ADAPTIVE_2'; formal_self_test='passed'; native_isolated_passes=3; desktop_capture=$false; microphone=$false} | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'adaptive-executable.json')
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: adaptive-voice-evidence
          path: |
            clients/desktop-client/target/release/DoubaoVoiceClient.exe
            ${{ runner.temp }}/adaptive-commit.txt
            ${{ runner.temp }}/adaptive-executable.json
            ${{ runner.temp }}/adaptive-selftest.*.txt
          if-no-files-found: error
          retention-days: 7
