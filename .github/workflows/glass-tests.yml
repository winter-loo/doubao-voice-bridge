name: Glass regression tests

on:
  pull_request:
    paths:
      - 'clients/desktop-client/src/liquid_glass.rs'
      - 'clients/desktop-client/src/glass_*.rs'
      - 'clients/desktop-client/src/main.rs'
      - '.github/workflows/glass-tests.yml'
  push:
    branches: ['feat/liquid-glass-overlay']
    paths:
      - 'clients/desktop-client/src/liquid_glass.rs'
      - 'clients/desktop-client/src/glass_*.rs'
      - 'clients/desktop-client/src/main.rs'
      - '.github/workflows/glass-tests.yml'

permissions:
  contents: read

concurrency:
  group: glass-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test procedural shading without GPUI or a display
        shell: bash
        run: |
          rustc --edition=2024 --test clients/desktop-client/src/liquid_glass.rs -o "$RUNNER_TEMP/glass-tests"
          "$RUNNER_TEMP/glass-tests"
      - name: Test background policy and bake coordination when present
        shell: bash
        run: |
          for source in glass_background glass_bake; do
            path="clients/desktop-client/src/$source.rs"
            if [ -f "$path" ]; then
              rustc --edition=2024 --test "$path" -o "$RUNNER_TEMP/$source-tests"
              "$RUNNER_TEMP/$source-tests"
            fi
          done
