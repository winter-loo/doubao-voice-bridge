name: Glass regression tests

on:
  pull_request:
    paths:
      - 'clients/desktop-client/src/liquid_glass.rs'
      - 'clients/desktop-client/src/glass_*.rs'
      - 'clients/desktop-client/src/main.rs'
      - 'clients/desktop-client/Cargo.toml'
      - 'clients/desktop-client/Cargo.lock'
      - 'clients/desktop-client/verify-native-*.ps1'
      - '.github/workflows/glass-tests.yml'
  push:
    branches: ['feat/liquid-glass-overlay']
    paths:
      - 'clients/desktop-client/src/liquid_glass.rs'
      - 'clients/desktop-client/src/glass_*.rs'
      - 'clients/desktop-client/verify-native-*.ps1'
      - '.github/workflows/glass-tests.yml'

permissions:
  contents: read
concurrency:
  group: glass-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  powershell-diagnostics:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse probes and compile embedded C# without running desktop tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5) {
              throw 'This gate must use Windows PowerShell 5.1, not pwsh.'
          }
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          $files = @(Get-ChildItem -LiteralPath 'clients/desktop-client' -File -Filter 'verify-native-*.ps1' | Sort-Object Name)
          if ($files.Count -eq 0) { throw 'No native diagnostic scripts found.' }
          foreach ($file in $files) {
              $tokens = $null
              $parseErrors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
              if (@($parseErrors).Count -gt 0) {
                  throw ($file.Name + ': ' + (($parseErrors | ForEach-Object { $_.Message }) -join '; '))
              }
              # Compile only the embedded source. Do not dot-source a diagnostic:
              # its top-level code may start windows, capture pixels or processes.
              $source = [IO.File]::ReadAllText($file.FullName)
              $blocks = [regex]::Matches($source, "(?ms)-TypeDefinition[ \t]+@'\r?\n(?<code>.*?)\r?\n'@")
              if ($blocks.Count -ne 1) { throw ('Expected exactly one C# block in ' + $file.Name) }
              Add-Type -TypeDefinition $blocks[0].Groups['code'].Value -ReferencedAssemblies System.Drawing,System.Windows.Forms -ErrorAction Stop
              Write-Output ('Compiled: ' + $file.Name)
          }
          Write-Output 'All diagnostic sources compiled; no preview, microphone or screen capture was started.'
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse application sources
        shell: bash
        run: |
          for source in main glass_preview glass_texture glass_native; do
            rustfmt --edition=2024 --config skip_children=true --emit stdout "clients/desktop-client/src/$source.rs" > /dev/null
          done
      - name: Test shading, background policy, bake coordination and content protection
        shell: bash
        run: |
          for source in liquid_glass glass_background glass_bake glass_policy; do
            rustc --edition=2024 --test "clients/desktop-client/src/$source.rs" -o "$RUNNER_TEMP/$source-tests"
            "$RUNNER_TEMP/$source-tests"
          done
  windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Compile both Windows binaries and run glass tests
        run: cargo test --locked --bins --manifest-path clients/desktop-client/Cargo.toml glass_
