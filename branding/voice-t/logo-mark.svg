<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Voice T Scheme C logo mark</title>
  <desc>Five-element speech waveform above one isolated vertical stem, forming a minimal capital T. Transparent background; no plate, stroke, glow, or shadow.</desc>
  <defs>
    <linearGradient id="brandGradient" gradientUnits="userSpaceOnUse" x1="0" y1="155" x2="0" y2="864">
      <stop offset="0%" stop-color="#1FD7F6"/>
      <stop offset="34%" stop-color="#25B6FF"/>
      <stop offset="68%" stop-color="#1879FF"/>
      <stop offset="100%" stop-color="#1455F5"/>
    </linearGradient>
  </defs>
  <g>
    <circle cx="222" cy="335" r="34" fill="url(#brandGradient)"/>
    <rect x="310" y="242" width="92" height="198" rx="46" fill="url(#brandGradient)"/>
    <rect x="454" y="155" width="116" height="332" rx="58" fill="url(#brandGradient)"/>
    <rect x="622" y="242" width="92" height="198" rx="46" fill="url(#brandGradient)"/>
    <circle cx="802" cy="335" r="34" fill="url(#brandGradient)"/>
    <rect x="459" y="555" width="106" height="309" rx="53" fill="url(#brandGradient)"/>
  </g>
</svg>
