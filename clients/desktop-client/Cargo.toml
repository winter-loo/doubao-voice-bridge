[package]
name = "doubao-voice-desktop-client"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "DoubaoVoiceClient"
path = "src/main.rs"

[dependencies]
gpui = { version = "=0.2.2", default-features = false }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"

[build-dependencies]
embed-resource = "3.0.11"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.17"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.12.3", default-features = false, features = ["async-std"] }
cpal = "0.17"
ctrlc = { version = "3.4", features = ["termination"] }
fs2 = "0.4"
futures-lite = "2"
gio = "0.18"
glib = "0.18"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "inspector", "wayland", "x11"] }
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
png = "0.18"
x11rb = { version = "0.13", features = ["xkb"] }
xkbcommon = "0.8"
