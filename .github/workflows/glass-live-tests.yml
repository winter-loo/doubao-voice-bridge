name: Custom glass live preview
on:
  push:
    branches: ['feat/glass-custom-material']
    paths: ['experiments/glass-live/**', '.github/workflows/glass-live-tests.yml']
  pull_request:
    paths: ['experiments/glass-live/**', '.github/workflows/glass-live-tests.yml']
permissions:
  contents: read
concurrency:
  group: custom-glass-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --manifest-path experiments/glass-live/Cargo.toml
      - run: cargo test --locked --manifest-path experiments/glass-material/Cargo.toml
  windows-gpu:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check immutable V2.2 shader reference
        shell: pwsh
        run: |
          $baseline = (git rev-parse HEAD:experiments/glass-live/src/glass.hlsl | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $baseline -ne '7a8126afc379257a34d27a4dbff6ac9125267eda') {
            throw 'V2.2 reference changed. Do not compare two jointly edited shaders.'
          }
      - name: Compile launchers and controller under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & './experiments/glass-live/run-preview.ps1' -CompileOnly
          & './experiments/glass-live/review-preview.ps1' -CompileOnly
      - name: Test actual optics, input, pair export and retained material controls; build executable
        shell: pwsh
        run: |
          $env:GLASS_MATERIAL_FIXTURES = Join-Path $env:RUNNER_TEMP 'glass-material-v2-fixtures'
          cargo test --locked --manifest-path experiments/glass-live/Cargo.toml -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --manifest-path experiments/glass-live/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute the default optical renderer on WARP and decode all fixtures
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'glass-live-gpu-fixtures'
          $help = & './experiments/glass-live/target/release/GlassLivePreview.exe' --help | Out-String
          if ($LASTEXITCODE -ne 0 -or -not $help.Contains('LENS_TRANSMISSION_1')) { throw 'Old renderer binary was built.' }
          & './experiments/glass-live/target/release/GlassLivePreview.exe' --self-test "--snapshot-dir=$dir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Type -AssemblyName System.Drawing
          $images = @(Get-ChildItem -LiteralPath $dir -Filter '*.png')
          if ($images.Count -ne 3) { throw 'Expected three runtime GPU fixture images.' }
          foreach ($image in $images) {
            $bitmap = [System.Drawing.Bitmap]::new($image.FullName)
            try {
              if ($bitmap.Width -ne 212 -or $bitmap.Height -ne 92) { throw 'Unexpected decoded PNG size.' }
            } finally { $bitmap.Dispose() }
          }
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'glass-material-v2-fixtures'
          $comparisons = @(Get-ChildItem -LiteralPath $fixtureRoot -Filter '*.png')
          if ($comparisons.Count -ne 8) { throw 'Expected eight historical V1/V2.2 comparison images.' }
          $surface = @(Get-ChildItem -LiteralPath (Join-Path $fixtureRoot 'surface-reflection') -Filter '*.png')
          if ($surface.Count -ne 12) { throw 'Expected twelve historical reflection-off/on comparison images.' }
          $issueRoot = Join-Path $env:RUNNER_TEMP 'glass-material-v2-fixtures.issue11'
          $parity = @(Get-ChildItem -LiteralPath $issueRoot -Recurse -File -Filter '*.png')
          if ($parity.Count -ne 8) { throw 'Expected eight V2.2/neutral-profile parity PNGs.' }
          $metrics = Get-Content -LiteralPath (Join-Path $issueRoot 'metrics.json') -Raw | ConvertFrom-Json
          if ($metrics.stage -ne 1 -or $metrics.cases -ne 192 -or $metrics.compared_pixels -ne 2201472 -or $metrics.max_rgb_error -gt 1 -or -not $metrics.alpha_exact) { throw 'Historical parameter-refactor parity failed.' }
          $v23Root = Join-Path $env:RUNNER_TEMP 'glass-material-v2-fixtures.issue11-v23'
          $v23 = @(Get-ChildItem -LiteralPath $v23Root -Recurse -File -Filter '*.png')
          if ($v23.Count -ne 48) { throw 'Expected retained V2.3 stage fixtures.' }
          $historical = Get-Content -LiteralPath (Join-Path $v23Root 'metrics.json') -Raw | ConvertFrom-Json
          if ($historical.cases -ne 36 -or -not $historical.alpha_exact -or -not $historical.opaque_foreground_exact -or $historical.min_synthetic_foreground_contrast -lt 7 -or $historical.max_veil_light_rgb_shift -gt 4 -or $historical.max_veil_dark_rgb_shift -gt 12) { throw 'Retained V2.3 contract failed.' }
          foreach ($image in @($comparisons + $surface + $parity + $v23)) {
            $bitmap = [System.Drawing.Bitmap]::new($image.FullName)
            try {
              if ($bitmap.Width -ne 214 -or $bitmap.Height -ne 91) { throw 'Unexpected historical PNG size.' }
            } finally { $bitmap.Dispose() }
          }
          $opticalRoot = Join-Path $env:RUNNER_TEMP 'glass-material-v2-fixtures.liquid'
          $optical = Get-Content -LiteralPath (Join-Path $opticalRoot 'metrics.json') -Raw | ConvertFrom-Json
          $ink = Get-Content -LiteralPath (Join-Path $opticalRoot 'legibility.json') -Raw | ConvertFrom-Json
          if ($optical.material -ne 'LENS_TRANSMISSION_1' -or $optical.cases -ne 42 -or $ink.min_contrast -lt 4.5 -or $ink.checked_pixels -lt 420) { throw 'Actual optical material contract missing or failed.' }
          $frames = @(Get-ChildItem -LiteralPath (Join-Path $opticalRoot 'input-motion') -File -Filter '*.png')
          $opticalImages = @(Get-ChildItem -LiteralPath $opticalRoot -Recurse -File -Filter '*.png')
          if ($frames.Count -ne 72 -or $opticalImages.Count -ne 102) { throw 'Missing optical or input-motion frames.' }
          foreach ($image in $opticalImages) {
            $moving = $image.Directory.Name -eq 'input-motion'
            $bitmap = [System.Drawing.Bitmap]::new($image.FullName)
            try {
              $w = if ($moving) { 348 } else { 214 }; $h = if ($moving) { 138 } else { 91 }
              if ($bitmap.Width -ne $w -or $bitmap.Height -ne $h) { throw 'Optical fixture decode/geometry failed.' }
            } finally { $bitmap.Dispose() }
          }
          'Actual optical runtime and all historical controls decoded. No real-desktop FPS or user visual acceptance implied.'
      - name: Upload executable and actual shader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GlassLivePreview-windows
          path: |
            experiments/glass-live/target/release/GlassLivePreview.exe
            ${{ runner.temp }}/glass-live-gpu-fixtures/*.png
            ${{ runner.temp }}/glass-material-v2-fixtures/**/*.png
            ${{ runner.temp }}/glass-material-v2-fixtures/**/metrics.json
            ${{ runner.temp }}/glass-material-v2-fixtures.issue11/**/*.png
            ${{ runner.temp }}/glass-material-v2-fixtures.issue11/metrics.json
            ${{ runner.temp }}/glass-material-v2-fixtures.issue11-v23/**/*.png
            ${{ runner.temp }}/glass-material-v2-fixtures.issue11-v23/metrics.json
            ${{ runner.temp }}/glass-material-v2-fixtures.issue11-v23/parameters.txt
            ${{ runner.temp }}/glass-material-v2-fixtures.liquid/**/*.png
            ${{ runner.temp }}/glass-material-v2-fixtures.liquid/*.json
          if-no-files-found: warn
          retention-days: 7
